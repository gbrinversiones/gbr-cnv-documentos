name: sondeo
on:
  push:
    branches: [claude/sondeo-soberanos]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    env:
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt && python sondeo/sondear.py
      - uses: actions/upload-artifact@v4
        with: {name: salida, path: salida}
