# Diagnostico de solo lectura (sin modelo, no escribe en el bucket): por que quedan documentos sin bajar / fallidos / estados contables
# desactualizados. Imprime lineas `DIAG ...` en el log del job.
name: Diagnostico CNV

on:
  workflow_dispatch:
    inputs:
      en_vivo:
        description: "Consultar tambien la CNV (ultimo estado contable publicado) de las empresas con huecos"
        type: boolean
        default: true

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Diagnostico
        run: python -m cnv diagnostico ${{ github.event.inputs.en_vivo == 'true' && '--en-vivo' || '' }}
