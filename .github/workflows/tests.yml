# Pruebas en cada PR y push a master: todo con fixtures y dobles, sin red ni claves. Exige >= 90% de cobertura de cnv/.
name: Pruebas

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --cov=cnv --cov-report=term-missing --cov-fail-under=90
