# Descarga los documentos publicos de la CNV de las empresas del universo (data/universo.csv), extrae el texto
# y lo guarda en Google Cloud Storage. Corre todos los dias y se puede disparar a mano (para la carga inicial
# se usa una fecha "desde" lejana y se repite hasta que no queden pendientes).
#
# Este repo es PUBLICO a proposito (los minutos de GitHub Actions son ilimitados). No contiene datos privados:
# las credenciales viven solo en los Secrets del repo (GCP_SA_KEY) y las variables (GCS_BUCKET).
name: Sincronizar documentos CNV

on:
  schedule:
    - cron: "30 12 * * *"   # 09:30 ART, todos los dias
    - cron: "30 22 * * 1-5" # 19:30 ART, despues del cierre
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha desde (AAAA-MM-DD). Diario: 30 dias atras."
        default: ""
      tipos:
        description: "Tipos de documento, separados por coma (hechos, estados_contables, prospectos, avisos_pago, actas)"
        default: "hechos,estados_contables,prospectos,avisos_pago,actas"
      max_paginas:
        description: "Tope de paginas de texto por documento (un prospecto puede tener cientos)"
        default: "400"
      max_caracteres:
        description: "Tope de caracteres de texto por documento"
        default: "1500000"
      tiempo_max:
        description: "Segundos maximos por fragmento"
        default: "18000"
      tope_usd:
        description: "Tope de gasto de la API en dolares POR PASO con modelo (CNV_MAX_USD): el paso se corta limpio al llegar. 6 pasos con modelo -> el maximo por corrida es 6x este valor"
        default: "1"
      cupo_modelo:
        description: "Multiplicador de los topes de los pasos con modelo (financieros 150, resumenes 400, clasificar 500 y sus tiempos). 1 = diario; 4 = puesta al dia del atraso"
        default: "1"
      concurrencia:
        description: "Llamadas al modelo en paralelo en los pasos con modelo (1-6; defecto 2 mientras la clave se comparta con el chatbot de produccion). Con 1 es el comportamiento secuencial de siempre. Baja sola si la API da limites de tasa sostenidos"
        default: "2"
      tpm:
        description: "Tokens de ENTRADA por minuto que el pipeline puede gastar (CNV_TPM; defecto 150000 = ~30% del limite de 500000 de la cuenta, el resto queda para produccion)"
        default: "150000"
      resetear_errores_api:
        description: "true = antes de los pasos con modelo, devuelve a pendiente los documentos marcados con error de API/cuenta (sin saldo, clave, limites de tasa) con `python -m cnv reintentos --reset`. No toca errores de contenido. Default false"
        default: "false"
      reextraer_sin_resultados:
        description: "true = el paso financieros vuelve a pedir (gasta modelo, ~US$ 0,002 por documento) los estados que no trajeron ni ventas ni resultado operativo (el estado de resultados quedaba fuera del recorte). Una sola vez por documento. Default false"
        default: "false"
      completar_campos:
        description: "true = el paso financieros vuelve a pedir (gasta modelo) los estados ya procesados con una version anterior del extractor para que sumen los campos nuevos (--completar-campos). Usar con cupo_modelo 3-4 hasta vaciar los pendientes. Default false"
        type: boolean
        default: false

      solo_diagnostico:
        description: "true = no descarga ni procesa nada: solo corre el job `diagnostico` (lectura, y unas pocas llamadas al modelo) y imprime lineas DIAG en el log. Default false"
        type: boolean
        default: false
      solo_ocr_ec:
        description: "true = no descarga ni procesa nada: solo corre el job `validar_ocr_ec` (OCR de estados contables escaneados de emisores con ONs + financieros con tope chico). Default false"
        type: boolean
        default: false

concurrency:
  group: ${{ github.event.inputs.solo_diagnostico == 'true' && 'sincronizar-cnv-diagnostico' || 'sincronizar-cnv' }}   # el diagnostico solo lee: no espera a la sincronizacion
  cancel-in-progress: false

jobs:
  diagnostico:
    if: ${{ github.event.inputs.solo_diagnostico == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Diagnostico de documentos fallidos, sin bajar y estados contables desactualizados (solo lectura, con consulta a la CNV)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CNV_MAX_USD: ${{ github.event.inputs.tope_usd || '1' }}
        run: |
          python -m cnv diagnostico --en-vivo
          python -m cnv diagnostico --sin-informe --probar-modelo 4 --estado sin_cifras
          python -m cnv diagnostico --sin-informe --probar-modelo 4 --estado sin_paginas_relevantes

  validar_ocr_ec:
    # Validacion acotada del OCR de estados contables escaneados (emisores con ONs): lee unos pocos con tesseract, los pasa por `financieros` (tope
    # chico) y muestra el resultado. No toca nada mas. Se dispara a mano con solo_ocr_ec = true.
    if: ${{ github.event.inputs.solo_ocr_ec == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CNV_MAX_USD: ${{ github.event.inputs.tope_usd || '1' }}
      CNV_OCR_CONFIANZA: "80"
      CNV_OCR_MAX_PAGINAS_EC: ${{ vars.CNV_OCR_MAX_PAGINAS_EC || '80' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar tesseract (espanol) y poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa poppler-utils
      - run: pip install -r requirements.txt -r requirements-ocr.txt
      - name: Estados contables pendientes del indice (incluye las caratulas de legalizacion con el balance embebido)
        run: python -m cnv sync --desde "$(date -u -d '30 days ago' +%F)" --tipos estados_contables --tiempo-max 2400
      - name: OCR de estados contables escaneados (solo emisores con ONs)
        run: python -m cnv ocr-ec --max-docs 1 --tiempo-max 5400
      - name: Cifras de los estados (texto nuevo y leidos por OCR; tope de documentos chico)
        run: python -m cnv financieros --max 80 --tiempo-max 1500
      - name: Cobertura
        run: python -m cnv cobertura

  descargar:
    if: ${{ github.event.inputs.solo_diagnostico != 'true' && github.event.inputs.solo_ocr_ec != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        fragmento: [0, 1, 2, 3]
    env:
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      CNV_MAX_PAGINAS: ${{ github.event.inputs.max_paginas || '400' }}
      CNV_MAX_CARACTERES: ${{ github.event.inputs.max_caracteres || '1500000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar y extraer texto
        run: |
          DESDE="${{ github.event.inputs.desde }}"
          if [ -z "$DESDE" ]; then DESDE=$(date -u -d "30 days ago" +%F); fi
          python -m cnv sync --desde "$DESDE" --tipos "${{ github.event.inputs.tipos || 'hechos,estados_contables,prospectos,avisos_pago,actas' }}" \
            --fragmento "${{ matrix.fragmento }}/4" --tiempo-max "${{ github.event.inputs.tiempo_max || '18000' }}"

  # OCR opcional de los PDF escaneados. Va en un job aparte porque necesita paquetes del sistema (tesseract con
  # idioma espanol, poppler) y es lento; si falla (apt caido, sin tesseract) no frena nada: continue-on-error.
  ocr:
    needs: descargar
    if: ${{ always() && github.event.inputs.solo_diagnostico != 'true' && github.event.inputs.solo_ocr_ec != 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      CNV_OCR: "1"
      CNV_OCR_MAX_PAGINAS: ${{ vars.CNV_OCR_MAX_PAGINAS || '40' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar tesseract (espanol) y poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa poppler-utils
      - run: pip install -r requirements.txt -r requirements-ocr.txt
      - name: OCR de documentos escaneados (max 30 por empresa)
        run: python -m cnv ocr --max-docs 30 --tiempo-max 6000
      # Estados contables que son imagen, de emisores con ONs: lectura con confianza >= 80 (lo dudoso queda [ilegible]); `financieros` los procesa despues con
      # compuertas extra y marca el periodo `ocr: true`. Cada uno tarda minutos: pocos por empresa y por corrida.
      - name: OCR de estados contables escaneados (emisores con ONs; max 2 por empresa)
        continue-on-error: true
        env:
          CNV_OCR_CONFIANZA: "80"
        run: python -m cnv ocr-ec --max-docs 2 --tiempo-max 5400

  indice:
    needs: [descargar, ocr]
    if: ${{ always() && github.event.inputs.solo_diagnostico != 'true' && github.event.inputs.solo_ocr_ec != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write         # solo para el issue diario de anomalias (paso «Alertas de salud»)
    timeout-minutes: 300  # topes propios de cada paso (~120 min con cupo 1; ~330 con cupo 4 que NO entra: usar cupo <= 3); con 30 se cancelaba a mitad
    env:
      CNV_MAX_USD: ${{ github.event.inputs.tope_usd || '1' }}
      CUPO_MODELO: ${{ github.event.inputs.cupo_modelo || '1' }}
      COMPLETAR_CAMPOS: ${{ github.event.inputs.completar_campos || 'false' }}
      REEXTRAER_SIN_RESULTADOS: ${{ github.event.inputs.reextraer_sin_resultados || 'false' }}
      CNV_CONCURRENCIA: ${{ github.event.inputs.concurrencia || '2' }}
      CNV_TPM: ${{ github.event.inputs.tpm || '150000' }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Anotar el tiempo de cada comando (se resume al final)
        run: echo "CNV_TIEMPOS=$RUNNER_TEMP/tiempos.tsv" >> "$GITHUB_ENV"
      - name: Reconstruir el indice global
        run: python -m cnv indice
      # Orden: primero lo barato y sin modelo (con lo que ya hay en el bucket: nunca queda sin correr aunque otro paso se corte), despues los
      # pasos con modelo (cada uno con su tope propio de documentos y de tiempo), y al final una segunda pasada de lo que depende de sus resultados.
      # Todos los pasos son independientes entre si: `if: always()` + `continue-on-error`, ninguno exige que otro haya terminado bien.
      - name: Indice de busqueda de texto completo (BM25; sin modelo)
        if: always()
        continue-on-error: true
        run: python -m cnv busqueda --tiempo-max 1500
      - name: Auditoria contable de las cifras (sin modelo)
        if: always()
        continue-on-error: true
        run: python -m cnv auditar-cifras
      - name: Ratios por emisor (desde las cifras verificadas; sin modelo)
        if: always()
        continue-on-error: true
        run: python -m cnv ratios
      - name: Cobertura de emisores y ONs (sin modelo)
        if: always()
        continue-on-error: true
        run: python -m cnv cobertura
      - name: Novedades de los ultimos 7 dias (sin modelo)
        if: always()
        continue-on-error: true
        run: python -m cnv novedades
      - name: Resetear errores de API/cuenta (solo si resetear_errores_api = true)
        if: ${{ github.event.inputs.resetear_errores_api == 'true' }}
        continue-on-error: true
        run: python -m cnv reintentos --reset
      - name: Extraer cifras de estados contables (Claude Haiku, max 150 documentos)
        if: always()
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          K="$CUPO_MODELO"; case "$K" in 1|2|3|4) ;; *) echo "cupo_modelo debe ser 1-4"; exit 1;; esac
          extra=(); if [ "$COMPLETAR_CAMPOS" = "true" ]; then extra=(--completar-campos); fi; if [ "$REEXTRAER_SIN_RESULTADOS" = "true" ]; then extra+=(--reextraer-sin-resultados); fi
          python -m cnv financieros --max $((150*K)) --tiempo-max $((1200*K)) "${extra[@]}"
      - name: Resumir hechos relevantes nuevos (Claude Haiku, max 400 por corrida)
        if: always()
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          K="$CUPO_MODELO"; case "$K" in 1|2|3|4) ;; *) echo "cupo_modelo debe ser 1-4"; exit 1;; esac
          python -m cnv resumenes --max $((400*K)) --tiempo-max $((1500*K))
      - name: Clasificar hechos relevantes (Claude Haiku, max 500 por corrida)
        if: always()
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          K="$CUPO_MODELO"; case "$K" in 1|2|3|4) ;; *) echo "cupo_modelo debe ser 1-4"; exit 1;; esac
          python -m cnv clasificar --max $((500*K)) --tiempo-max $((900*K))
      - name: Eventos estructurados de hechos relevantes (Claude Haiku, max 150 por corrida)
        if: always()
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          K="$CUPO_MODELO"; case "$K" in 1|2|3|4) ;; *) echo "cupo_modelo debe ser 1-4"; exit 1;; esac
          python -m cnv eventos --max $((150*K)) --tiempo-max $((900*K))
      - name: Estructurar avisos de pago de ONs (Claude Haiku, max 200 por corrida)
        if: always()
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m cnv avisos-pago --max 200 --tiempo-max 900
      - name: Condiciones de emision de las ON (Claude Haiku, max 100 documentos)
        if: always()
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m cnv condiciones --max 100 --tiempo-max 1200
      - name: Auditoria contable de las cifras (segunda pasada, con las cifras nuevas)
        if: always()
        continue-on-error: true
        run: python -m cnv auditar-cifras
      - name: Ratios por emisor (segunda pasada)
        if: always()
        continue-on-error: true
        run: python -m cnv ratios
      - name: Cobertura de emisores y ONs (segunda pasada)
        if: always()
        continue-on-error: true
        run: python -m cnv cobertura
      - name: Perfiles de emisor (texto plantilla con datos verificados; sin modelo)
        if: always()
        continue-on-error: true
        run: python -m cnv perfiles
      - name: Salud de la base (resumen del job)
        if: always()
        continue-on-error: true
        run: python -m cnv salud >> "$GITHUB_STEP_SUMMARY"
      - name: Muestra de calidad de cifras (resumen del job)
        if: always()
        continue-on-error: true
        run: python -m cnv calidad >> "$GITHUB_STEP_SUMMARY"
      - name: Alertas de salud (un issue por dia como maximo, solo si hay anomalias)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m cnv salud --anomalias salud_anomalias.md
          if [ -s salud_anomalias.md ]; then
            hoy=$(date -u +%F)
            gh label create salud-cnv --color D93F0B --description "Anomalias detectadas por python -m cnv salud" 2>/dev/null || true
            ya=$(gh issue list --label salud-cnv --state all --search "created:>=$hoy" --json number --jq 'length')
            if [ "$ya" = "0" ]; then
              gh issue create --label salud-cnv --title "Salud CNV: anomalias del $hoy" --body-file salud_anomalias.md
            else
              echo "Ya hay un issue de salud de hoy: no se crea otro."
            fi
          fi
      - name: Novedades de los ultimos 7 dias (segunda pasada)
        if: always()
        continue-on-error: true
        run: python -m cnv novedades
      - name: Exportables CSV para analistas (sin modelo)
        if: always()
        continue-on-error: true
        run: python -m cnv exportar
      - name: Series historicas por emisor para graficos (sin modelo)
        if: always()
        continue-on-error: true
        run: python -m cnv series
      - name: Tiempo por paso (resumen del job)
        if: always()
        continue-on-error: true
        run: python -m cnv tiempos >> "$GITHUB_STEP_SUMMARY"
